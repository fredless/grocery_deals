name: Scrape Weekly Ads

on:
  schedule:
    - cron: '0 10 * * 3,4'  # Wednesday and Thursday at 10am UTC (already-processed flyers are skipped)
  workflow_dispatch:        # can trigger it manually from GitHub too

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas google-genai python-dotenv tenacity

      - name: Run scraper
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scrape.py

      - name: Run converter
        run: python build_deals.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deals.json data
          git diff --staged --quiet || git commit -m "weekly update"
          git push